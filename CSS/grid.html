<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Lesson</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Grid Lesson </h1>

    <div class="gridone">
        <div style="background-color: blueviolet;">1</div>
        <div style="background-color: #31b3d7;">2</div>
        <div style="background-color: #532be2;">3</div>
        <div style="background-color: #099114;">4</div>
        <div style="background-color: #e26b2b;">5</div>
        <div style="background-color: #c04042;">6</div>
        <div style="background-color: #2c3e48;">7</div>
        <div style="background-color: #937f40;">8</div>
        <div style="background-color: #539456;">9</div>
        
    </div>

<h1>Grid column add</h1>
    <div class="gridcolumnadd">
        <div style="background-color: blueviolet;">1</div>
        <div style="background-color: #31b3d7;">2</div>
        <div style="background-color: #532be2;">3</div>
        <div style="background-color: #099114;">4</div>
        <div style="background-color: #e26b2b;" class="startadd">5</div>
        <div style="background-color: #c04042;">6</div>
        <div style="background-color: #2c3e48;">7</div>
        <div style="background-color: #937f40;">8</div>
        <div style="background-color: #539456;">9</div>
        
    </div>

    <h1>Grid row add</h1>
    <div class="gridrowadd">
        <div style="background-color: blueviolet;">1</div>
        <div style="background-color: #31b3d7;">2</div>
        <div style="background-color: #532be2;">3</div>
        <div style="background-color: #099114;">4</div>
        <div style="background-color: #e26b2b;" class="rowadd">5</div>
        <div style="background-color: #c04042;">6</div>
        <div style="background-color: #2c3e48;">7</div>
        <div style="background-color: #937f40;">8</div>
        <div style="background-color: #539456;">9</div>
        
    </div>
</body>
</html>
